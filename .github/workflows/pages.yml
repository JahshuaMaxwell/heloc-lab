name: Publish calculator to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Copy the static site into the Pages folder
        run: |
          mkdir -p /tmp/heloc-notes
          find docs -maxdepth 1 -name '*.md' -exec mv {} /tmp/heloc-notes/ \;
          rm -rf docs
          mkdir -p docs/notes
          cp -a out/. docs/
          mv /tmp/heloc-notes/*.md docs/notes/ 2>/dev/null || true
          touch docs/.nojekyll
      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Docs folder already matches the build."
          else
            git commit -m "Publish the calculator to GitHub Pages."
            git push
          fi
